name: Release Assets Builder

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Binaries
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Verify and package release archives
        run: |
          if [ ! -f target/aarch64-apple-darwin/release/qrshare ]; then
              echo "Error: Missing binary for aarch64-apple-darwin"
              exit 1
          fi
          cp target/aarch64-apple-darwin/release/qrshare .
          tar -czf qrshare-macos-arm64.tar.gz qrshare README.md LICENSE
          rm qrshare

          if [ ! -f target/x86_64-apple-darwin/release/qrshare ]; then
              echo "Error: Missing binary for x86_64-apple-darwin"
              exit 1
          fi
          cp target/x86_64-apple-darwin/release/qrshare .
          tar -czf qrshare-macos-x86_64.tar.gz qrshare README.md LICENSE
          rm qrshare

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: qrshare-macos-*.tar.gz
          retention-days: 1

  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf

      - name: Install Zig compiler
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf

      - name: Verify and package release archives
        run: |
          if [ ! -f target/x86_64-unknown-linux-musl/release/qrshare ]; then
              echo "Error: Missing binary for x86_64-unknown-linux-musl"
              exit 1
          fi
          cp target/x86_64-unknown-linux-musl/release/qrshare .
          tar -czf qrshare-linux-x86_64.tar.gz qrshare README.md LICENSE
          rm qrshare

          if [ ! -f target/aarch64-unknown-linux-musl/release/qrshare ]; then
              echo "Error: Missing binary for aarch64-unknown-linux-musl"
              exit 1
          fi
          cp target/aarch64-unknown-linux-musl/release/qrshare .
          tar -czf qrshare-linux-arm64.tar.gz qrshare README.md LICENSE
          rm qrshare

          if [ ! -f target/armv7-unknown-linux-musleabihf/release/qrshare ]; then
              echo "Error: Missing binary for armv7-unknown-linux-musleabihf"
              exit 1
          fi
          cp target/armv7-unknown-linux-musleabihf/release/qrshare .
          tar -czf qrshare-linux-armv7.tar.gz qrshare README.md LICENSE
          rm qrshare

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: qrshare-linux-*.tar.gz
          retention-days: 1

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Verify and package release archives
        run: |
          if (-not (Test-Path "target/x86_64-pc-windows-msvc/release/qrshare.exe")) {
              Write-Error "Error: Missing binary for x86_64-pc-windows-msvc"
              exit 1
          }
          Copy-Item target/x86_64-pc-windows-msvc/release/qrshare.exe .
          Compress-Archive -Path qrshare.exe, README.md, LICENSE -DestinationPath qrshare-windows-x86_64.zip
          Remove-Item qrshare.exe

          if (-not (Test-Path "target/aarch64-pc-windows-msvc/release/qrshare.exe")) {
              Write-Error "Error: Missing binary for aarch64-pc-windows-msvc"
              exit 1
          }
          Copy-Item target/aarch64-pc-windows-msvc/release/qrshare.exe .
          Compress-Archive -Path qrshare.exe, README.md, LICENSE -DestinationPath qrshare-windows-arm64.zip
          Remove-Item qrshare.exe
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: qrshare-windows-*.zip
          retention-days: 1

  publish-assets:
    name: Publish Assets to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Create output directory
        run: mkdir dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist

      - name: Generate SHA256SUMS checksums
        run: |
          cd dist
          sha256sum qrshare-* > SHA256SUMS
          cat SHA256SUMS

      - name: Show generated artifacts
        run: ls -lh dist

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qrshare-*.tar.gz
            dist/qrshare-*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
