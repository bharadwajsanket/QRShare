[package]
name = "qrshare"
version = "2.5.4"
edition = "2021"
rust-version = "1.75"
authors = ["Sanket Bharadwaj"]
description = "Fast, private, local file sharing via QR code. Zero config, single binary, LAN-only."
license = "MIT"
repository = "https://github.com/bharadwajsanket/QRShare"
homepage = "https://github.com/bharadwajsanket/QRShare"
documentation = "https://github.com/bharadwajsanket/QRShare#readme"
readme = "README.md"
keywords = ["file-sharing", "qrcode", "lan", "cli", "networking"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.14"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
mime_guess = "2.0"
pulldown-cmark = "0.10"
percent-encoding = "2.3"
rpassword = "7.3"
bytes = "1.6"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4"] }
http = "1.1"
http-body = "1.1"
